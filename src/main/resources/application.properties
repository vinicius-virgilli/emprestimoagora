# Configurações gerais da aplicação
quarkus.application.name=emprestimoagora
quarkus.application.version=1.0.0-SNAPSHOT

# Configurações de logging
quarkus.log.level=INFO
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# Configurações de HTTP
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# Configurações de CORS
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.headers=*
quarkus.http.cors.methods=*

# Configurações do OpenAPI/Swagger
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
mp.openapi.extensions.smallrye.info.title=EmprestimoAgora API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=API para sistema de empréstimos

# Configurações de JWT (DESABILITADO)
# mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
# mp.jwt.verify.issuer=https://emprestimoagora.com
# smallrye.jwt.sign.key.location=META-INF/resources/privateKey.pem

# Profile ativo (será sobrescrito por variável de ambiente)
# quarkus.profile=dev