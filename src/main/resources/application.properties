# Configurações gerais da aplicação
quarkus.application.name=api-emprestimo-agora
quarkus.application.version=1.0.0-SNAPSHOT

# Configurações de banco de dados - SQL Server externo
quarkus.datasource.db-kind=mssql
quarkus.datasource.username=${DB_USERNAME:hack}
quarkus.datasource.password=${DB_PASSWORD:Password23}
quarkus.datasource.jdbc.url=jdbc:sqlserver://${DB_HOST:dbhackathon.database.windows.net}:${DB_PORT:1433};databaseName=${DB_NAME:hack};encrypt=true;trustServerCertificate=false;hostNameInCertificate=${DB_HOST_CERTIFICATE:*.database.windows.net};loginTimeout=30;
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX_SIZE:20}
quarkus.datasource.jdbc.min-size=${DB_POOL_MIN_SIZE:5}
quarkus.datasource.jdbc.acquisition-timeout=${DB_ACQUISITION_TIMEOUT:10}
quarkus.datasource.jdbc.leak-detection-interval=${DB_LEAK_DETECTION:10M}

# Configurações de Hibernate para produção
quarkus.hibernate-orm.database.generation=${DB_GENERATION_STRATEGY:validate}
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.hibernate-orm.dialect=org.hibernate.dialect.SQLServerDialect
quarkus.hibernate-orm.packages=org.viniciusvirgilli.model.hack

# PROPRIEDADES DATASOURCE - LOCAL Postgres
quarkus.datasource.local.db-kind=postgresql
quarkus.datasource.local.username=${LOCAL_DB_USERNAME:postgres}
quarkus.datasource.local.password=${LOCAL_DB_PASSWORD:postgres123}
quarkus.datasource.local.jdbc.url=jdbc:postgresql://${LOCAL_DB_HOST:localhost}:${LOCAL_DB_PORT:5432}/${LOCAL_DB_NAME:emprestimoagora-postgres}
quarkus.datasource.local.jdbc.max-size=16
quarkus.datasource.local.jdbc.min-size=2

# Propriedades hibernate ORM - local
quarkus.hibernate-orm.local.datasource=local
quarkus.hibernate-orm.local.database.generation=update
quarkus.hibernate-orm.local.packages=org.viniciusvirgilli.model.local
quarkus.hibernate-orm.local.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configurações de logging para produção (priorizadas do prod)
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.category."org.viniciusvirgilli".level=${APP_LOG_LEVEL:INFO}
quarkus.log.category."org.hibernate".level=WARN
quarkus.log.category."org.hibernate.SQL".level=WARN
quarkus.log.console.enable=${LOG_CONSOLE_ENABLED:true}
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n

# Configurações de HTTP para produção (priorizadas do prod)
quarkus.http.port=${HTTP_PORT:8080}
quarkus.http.host=${HTTP_HOST:0.0.0.0}
#quarkus.http.ssl-port=${HTTPS_PORT:8443}
#quarkus.http.insecure-requests=${HTTP_INSECURE_REQUESTS:redirect}

# Configurações de CORS para produção (priorizadas do prod)
#quarkus.http.cors=true
#quarkus.http.cors.origins=${CORS_ORIGINS:https://api-emprestimo-agora.com,https://www.api-emprestimo-agora.com}
#quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
#quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS
#quarkus.http.cors.exposed-headers=Content-Disposition
#quarkus.http.cors.access-control-max-age=24H

# Configurações de cache para produção (priorizadas do prod)
quarkus.cache.enabled=true
quarkus.cache.caffeine."default".initial-capacity=100
quarkus.cache.caffeine."default".maximum-size=1000
quarkus.cache.caffeine."default".expire-after-write=5M

# Cache específico para produtos (mantido do original)
quarkus.cache.caffeine."produtos-cache".initial-capacity=20
quarkus.cache.caffeine."produtos-cache".maximum-size=100
quarkus.cache.caffeine."produtos-cache".expire-after-write=6m

# Cache sob demanda para findAll() de Produtos
app.cache.produtos.refresh-interval=4m
quarkus.cache.caffeine.produtos-findall-cache.initial-capacity=1
quarkus.cache.caffeine.produtos-findall-cache.maximum-size=1
quarkus.cache.caffeine.produtos-findall-cache.expire-after-access=5M

# Logs específicos para cache de produtos
quarkus.log.category."org.viniciusvirgilli.service.ProdutoCacheService".level=INFO

# Configurações de JWT para produção (priorizadas do prod)
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:META-INF/resources/publicKey.pem}
smalrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:META-INF/resources/privateKey.pem}
mp.jwt.verify.issuer=${JWT_ISSUER:https://api-emprestimo-agora.com}
mp.jwt.token.header=${JWT_TOKEN_HEADER:Authorization}
mp.jwt.token.cookie=${JWT_TOKEN_COOKIE:jwt}

# Configurações de scheduler para produção
quarkus.scheduler.enabled=${SCHEDULER_ENABLED:true}
quarkus.scheduler.start-mode=${SCHEDULER_START_MODE:normal}

# Configurações de segurança para produção
#quarkus.http.auth.basic=false
#quarkus.http.auth.form.enabled=false
#quarkus.http.auth.session.encryption-key=${SESSION_ENCRYPTION_KEY:change_me_32_character_secret_key}

# Configurações do OpenAPI/Swagger (priorizadas do prod)
quarkus.swagger-ui.always-include=${SWAGGER_ENABLED:false}
quarkus.swagger-ui.path=${SWAGGER_PATH:/swagger-ui}
mp.openapi.extensions.smallrye.info.title=API Emprestimo Agora
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=API para simulação de empréstimos - Ambiente de Produção

# Configurações de monitoramento (priorizadas do prod)
quarkus.micrometer.enabled=${METRICS_ENABLED:true}
quarkus.micrometer.export.prometheus.enabled=${PROMETHEUS_ENABLED:true}
quarkus.micrometer.export.prometheus.path=${PROMETHEUS_PATH:/metrics}

# Configurações de health check
quarkus.health.enabled=${HEALTH_CHECK_ENABLED:true}
quarkus.health.openapi.included=${HEALTH_OPENAPI_INCLUDED:true}

# Configurações de performance
quarkus.thread-pool.core-threads=${THREAD_POOL_CORE:8}
quarkus.thread-pool.max-threads=${THREAD_POOL_MAX:30}
quarkus.thread-pool.queue-size=${THREAD_POOL_QUEUE:1000}

# Configurações de timeout
quarkus.http.read-timeout=${HTTP_READ_TIMEOUT:30S}
quarkus.http.idle-timeout=${HTTP_IDLE_TIMEOUT:30S}

# Profile ativo (será sobrescrito por variável de ambiente)
# quarkus.profile=dev

quarkus.smallrye-metrics.enabled=true
#quarkus.smallrye-metrics.export-prometheus.enabled=true

# Configura��es espec�ficas do EventHub Service
eventhub.enabled=true
eventhub.connection.string=Endpoint=sb://eventhack.servicebus.windows.net/;SharedAccessKeyName=hack;SharedAccessKey=HeHeVaVqyVkntO2FnjQcs2Ilh/4MUDo4y+AEhKp8z+g=;EntityPath=simulacoes

# Mantém seu app em INFO, mas silencia o SDK da Azure AMQP
quarkus.log.category."com.azure.core.amqp".level=WARNING
quarkus.log.category."com.azure.messaging".level=WARNING
quarkus.log.category."com.azure".level=WARNING

# Reduz os logs do Hibernate
quarkus.log.category."org.hibernate.type.descriptor.sql".level=WARNING

# Configurações do Jackson para BigDecimal
quarkus.jackson.write-bigdecimal-as-plain=true
quarkus.jackson.serialization.write-bigdecimal-as-plain=true

# Habilita histogramas para timers do HTTP server
quarkus.micrometer.binder.http-server.request.histogram-enabled=true
# Habilita percentis
quarkus.micrometer.binder.http-server.request.percentiles=0.5,0.95,0.99

# Configurações do OpenTelemetry
# Desabilita a exportação de traces para evitar erro de conexão gRPC
quarkus.otel.traces.exporter=none
# Ou alternativamente, use logging para debug:
# quarkus.otel.traces.exporter=logging

# Configurações de métricas OpenTelemetry
quarkus.otel.metrics.exporter=none
# Ou use prometheus se quiser exportar métricas:
# quarkus.otel.metrics.exporter=prometheus

# Configurações gerais do OpenTelemetry
quarkus.otel.service.name=emprestimo-agora
quarkus.otel.service.version=1.0.0

