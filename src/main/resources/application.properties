# Configurações gerais da aplicação
quarkus.application.name=api-emprestimo-agora
quarkus.application.version=1.0.0-SNAPSHOT

# Configurações de logging
quarkus.log.level=INFO
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# Configurações de HTTP
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# Configurações de CORS
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.headers=*
quarkus.http.cors.methods=*

# Configurações do OpenAPI/Swagger
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
mp.openapi.extensions.smallrye.info.title=API Emprestimo Agora
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=API para simulação de empréstimos

# Configurações de Cache
quarkus.cache.enabled=true
quarkus.cache.caffeine."produtos-cache".initial-capacity=20
quarkus.cache.caffeine."produtos-cache".maximum-size=100
quarkus.cache.caffeine."produtos-cache".expire-after-write=6m

# Configurações de JWT (DESABILITADO)
# mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
# mp.jwt.verify.issuer=https://api-emprestimo-agora.com
# smallrye.jwt.sign.key.location=META-INF/resources/privateKey.pem

# Profile ativo (será sobrescrito por variável de ambiente)
# quarkus.profile=dev

quarkus.smallrye-metrics.enabled=true
#quarkus.smallrye-metrics.export-prometheus.enabled=true

# Configurações do Event Hub
eventhub.enabled=${EVENTHUB_ENABLED:true}
eventhub.connection.string=${EVENTHUB_CONNECTION_STRING:Endpoint=sb://eventhack.servicebus.windows.net/;SharedAccessKeyName=hack;SharedAccessKey=HeHeVaVqyVkntO2FnjQcs2ilh/4MUDo4y+AEhkp8z+g=;EntityPath=simulacoes}
eventhub.name=${EVENTHUB_NAME:simulacoes}

# Mant�m seu app em INFO, mas silencia o SDK da Azure AMQP
quarkus.log.category."com.azure.core.amqp".level=WARNING
quarkus.log.category."com.azure.messaging".level=WARNING
quarkus.log.category."com.azure".level=WARNING

# Reduz os logs do Hibernate
quarkus.log.category."org.hibernate".level=WARNING
quarkus.log.category."org.hibernate.SQL".level=WARNING
quarkus.log.category."org.hibernate.type.descriptor.sql".level=WARNING

# Cache específico para findAll() de Produtos
app.cache.produtos.refresh-interval=4m

# Configuração do cache Caffeine para produtos
# Cache sob demanda para findAll() de Produtos
# Expira 5 minutos após o último acesso
quarkus.cache.caffeine.produtos-findall-cache.initial-capacity=1
quarkus.cache.caffeine.produtos-findall-cache.maximum-size=1
quarkus.cache.caffeine.produtos-findall-cache.expire-after-access=5M

# Logs específicos para cache de produtos
quarkus.log.category."org.viniciusvirgilli.service.ProdutoCacheService".level=INFO
