# Configurações para ambiente de TESTE

# banco default (H2 para desenvolvimento)
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/api_emprestimo_agora_local;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
quarkus.datasource.jdbc.max-size=16
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.acquisition-timeout=${DB_ACQUISITION_TIMEOUT:10}
quarkus.datasource.jdbc.leak-detection-interval=${DB_LEAK_DETECTION:10M}
# Hibernate para banco default
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.format-sql=true
quarkus.hibernate-orm.packages=org.viniciusvirgilli.model.hack


# PROPRIEDADES DATASOURCE - LOCAL
quarkus.datasource.local.db-kind=h2
quarkus.datasource.local.username=sa
quarkus.datasource.local.password=
quarkus.datasource.local.jdbc.url=jdbc:h2:file:./data/api_emprestimo_agora_local;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
quarkus.datasource.local.jdbc.max-size=16
quarkus.datasource.local.jdbc.min-size=2
# Propriedades hibernate ORM - local
quarkus.hibernate-orm.local.datasource=local
quarkus.hibernate-orm.local.database.generation=update
quarkus.hibernate-orm.local.log.sql=true
quarkus.hibernate-orm.local.log.format-sql=true
quarkus.hibernate-orm.local.packages=org.viniciusvirgilli.model.local

# Configurações de logging para testes
quarkus.log.level=WARN
quarkus.log.category."org.viniciusvirgilli".level=INFO
quarkus.log.category."org.hibernate".level=WARN
quarkus.log.category."org.hibernate.SQL".level=WARN
quarkus.log.console.enable=true

# Configurações de HTTP para testes
quarkus.http.port=8082
quarkus.http.test-port=8083

# Configurações de CORS para testes
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000,http://localhost:8082
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS

# Configurações de cache para testes
quarkus.cache.enabled=false

# Configurações de JWT para testes
mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
smallrye.jwt.sign.key.location=META-INF/resources/privateKey.pem
mp.jwt.verify.issuer=https://api-emprestimo-agora-test.com

# Configurações de scheduler para testes
quarkus.scheduler.enabled=false

# Configurações específicas para testes
quarkus.test.hang-detection-timeout=60s
quarkus.test.flat-class-path=true

# Configurações de transação para testes
quarkus.transaction-manager.enable-recovery=false

# Configurações de OpenAPI para testes
quarkus.swagger-ui.always-include=false