# Configurações para ambiente de DESENVOLVIMENTO

# Configurações de banco de dados - SQL Server externo
quarkus.datasource.db-kind=mssql
quarkus.datasource.username=${DB_USERNAME:hack}
quarkus.datasource.password=${DB_PASSWORD:Password23}
quarkus.datasource.jdbc.url=jdbc:sqlserver://${DB_HOST:dbhackathon.database.windows.net}:${DB_PORT:1433};databaseName=${DB_NAME:hack};encrypt=true;trustServerCertificate=false;hostNameInCertificate=${DB_HOST_CERTIFICATE:*.database.windows.net};loginTimeout=30;
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX_SIZE:20}
quarkus.datasource.jdbc.min-size=${DB_POOL_MIN_SIZE:5}
quarkus.datasource.jdbc.acquisition-timeout=${DB_ACQUISITION_TIMEOUT:10}
quarkus.datasource.jdbc.leak-detection-interval=${DB_LEAK_DETECTION:10M}

# Configurações de Hibernate para Banco default
quarkus.hibernate-orm.database.generation=${DB_GENERATION_STRATEGY:validate}
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.hibernate-orm.dialect=org.hibernate.dialect.SQLServerDialect
quarkus.hibernate-orm.packages=org.viniciusvirgilli.model.hack

# PROPRIEDADES DATASOURCE - LOCAL
quarkus.datasource.local.db-kind=h2
quarkus.datasource.local.username=sa
quarkus.datasource.local.password=
quarkus.datasource.local.jdbc.url=jdbc:h2:file:./data/api_emprestimo_agora_local;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
quarkus.datasource.local.jdbc.max-size=16
quarkus.datasource.local.jdbc.min-size=2

# Propriedades hibernate ORM - local
quarkus.hibernate-orm.local.datasource=local
quarkus.hibernate-orm.local.database.generation=update
quarkus.hibernate-orm.local.log.sql=true
quarkus.hibernate-orm.local.log.format-sql=true
quarkus.hibernate-orm.local.packages=org.viniciusvirgilli.model.local

# Configurações de logging mais verbosas para desenvolvimento
quarkus.log.level=DEBUG
quarkus.log.category."org.viniciusvirgilli".level=DEBUG
quarkus.log.category."org.hibernate".level=INFO
quarkus.log.category."org.hibernate.SQL".level=DEBUG

# Configurações de desenvolvimento
quarkus.live-reload.instrumentation=true
quarkus.dev.ui.enabled=true

# Configurações de HTTP para desenvolvimento
quarkus.http.port=8080
quarkus.http.test-port=8081

# Configurações de CORS mais permissivas para desenvolvimento
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000,http://localhost:8080,http://127.0.0.1:3000
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS

# Configurações de JWT para desenvolvimento (DESABILITADO)
# mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
# smallrye.jwt.sign.key.location=META-INF/resources/privateKey.pem
# mp.jwt.verify.issuer=https://api-emprestimo-agora-dev.com

# Configurações do EventHub - Simulador local para desenvolvimento
eventhub.connection.string=Endpoint=sb://localhost:9093/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=fake-key-for-development
