# banco default (H2 para desenvolvimento)
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/api_emprestimo_agora_local;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
quarkus.datasource.jdbc.max-size=16
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.acquisition-timeout=${DB_ACQUISITION_TIMEOUT:10}
quarkus.datasource.jdbc.leak-detection-interval=${DB_LEAK_DETECTION:10M}
# Hibernate para banco default
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.format-sql=true
quarkus.hibernate-orm.packages=org.viniciusvirgilli.model.hack


# PROPRIEDADES DATASOURCE - LOCAL
quarkus.datasource.local.db-kind=h2
quarkus.datasource.local.username=sa
quarkus.datasource.local.password=
quarkus.datasource.local.jdbc.url=jdbc:h2:file:./data/api_emprestimo_agora_local;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
quarkus.datasource.local.jdbc.max-size=16
quarkus.datasource.local.jdbc.min-size=2
# Propriedades hibernate ORM - local
quarkus.hibernate-orm.local.datasource=local
quarkus.hibernate-orm.local.database.generation=update
quarkus.hibernate-orm.local.log.sql=true
quarkus.hibernate-orm.local.log.format-sql=true
quarkus.hibernate-orm.local.packages=org.viniciusvirgilli.model.local


# Log mais verboso para desenvolvimento
#quarkus.log.level=DEBUG
#quarkus.log.category."org.viniciusvirgilli".level=DEBUG
#quarkus.log.category."org.hibernate".level=INFO
#quarkus.log.category."org.hibernate.SQL".level=DEBUG


quarkus.live-reload.instrumentation=true
quarkus.dev.ui.enabled=true
