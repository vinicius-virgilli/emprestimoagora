version: '3.8'

services:
  postgres-dev:
    image: postgres:15-alpine
    container_name: emprestimoagora-postgres-dev
    environment:
      POSTGRES_DB: emprestimoagora_dev
      POSTGRES_USER: emprestimoagora
      POSTGRES_PASSWORD: dev123456
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/db/migration:/docker-entrypoint-initdb.d
    networks:
      - emprestimoagora-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emprestimoagora -d emprestimoagora_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Opcional: PgAdmin para administração do banco
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: emprestimoagora-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@emprestimoagora.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres-dev
    networks:
      - emprestimoagora-network
    profiles:
      - tools

  # Simulador do Azure Event Hub para desenvolvimento
  eventhub-simulator:
    image: mcr.microsoft.com/azure-messaging/eventhubs-emulator:latest
    container_name: emprestimoagora-eventhub
    environment:
      ACCEPT_EULA: Y
    ports:
      - "5672:5672"   # AMQP
      - "9093:9093"   # Kafka
    networks:
      - emprestimoagora-network
    profiles:
      - dev

volumes:
  postgres_data:
    driver: local

networks:
  emprestimoagora-network:
    driver: bridge